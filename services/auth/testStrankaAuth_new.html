    <!-- USERS (оставлено как есть) -->

    <h2>Vložení nového uživatele</h2>
<form id="createForm">
    <input type="text" id="cusername" placeholder="Uživatelské jméno" required>
    <input type="text" id="cpassword" placeholder="Heslo" required>
    <input type="text" id="cdisplayName" placeholder="Skutečné jméno" required>
    <input type="text" id="cemail" placeholder="Email" required>
    <input type="text" id="corganizationIds" placeholder="ID organizace">
    <input type="text" id="cinstitutionIds" placeholder="ID instituce">
    <input type="text" id="croles" placeholder="Role">
    <button type="submit">Odeslat</button>
</form>
 <div id="odpovedVlozeni">
     
    </div>
<script>
const createForm = document.getElementById('createForm');

createForm.addEventListener('submit', async (e) => {
    e.preventDefault(); // Zamezí obnovení stránky

    // Získání hodnot z inputů
    const cusername = document.getElementById('cusername').value;
    const cpassword = document.getElementById('cpassword').value;
    const cdisplayName= document.getElementById('cdisplayName').value;
    const cemail = document.getElementById('cemail').value;
    const corganizationIds = document.getElementById('corganizationIds').value;
    const cinstitutionIds = document.getElementById('cinstitutionIds').value;
    const croles = document.getElementById('croles').value;

    // Odeslání dat pomocí fetch
    const cresponse = await fetch('http://localhost:5000/v1/users/createUser', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json' // Zásadní pro to, aby Node.js věděl, že posíláš JSON
        },
        body: JSON.stringify({ 
            username: cusername, 
            password: cpassword,
            displayName: cdisplayName, 
            email: cemail, 
            organizationIds: [corganizationIds, corganizationIds], 
            institutionIds: [cinstitutionIds, cinstitutionIds], 
            roles: [croles, croles]  
    }) // Převede objekt na text
    });

    const cresult = await cresponse.json();
    console.log(cresult);
    document.getElementById("odpovedVlozeni").innerHTML = cresult.message + ", Uživatel:" + cresult.user.username;
});
</script>
<br>

<h2>Přihlášení uživatele</h2>
<form id="loginForm">
    <input type="text" id="username" placeholder="Uživatelské jméno" required>
    <input type="password" id="password" placeholder="Heslo" required>
    <button type="submit">Odeslat</button>
</form>
 <div id="odpovedPrihlaseni">
     
    </div><br><br>
<script>
const loginForm = document.getElementById('loginForm');

loginForm.addEventListener('submit', async (e) => {
    e.preventDefault(); // Zamezí obnovení stránky

    // Získání hodnot z inputů
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    // Odeslání dat pomocí fetch
    const response = await fetch('http://localhost:5000/v1/auth/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json' // Zásadní pro to, aby Node.js věděl, že posíláš JSON
        },
        body: JSON.stringify({ username, password }) // Převede objekt na text
    });

    const result = await response.json();
    console.log(result);
    document.getElementById("odpovedPrihlaseni").innerHTML = "Token: " + result.token + ", Chyba: " + result.error;
});
</script>

<h2>Seznam organizací</h2>

<form id="orgListForm">
  <button>Zobrazit / Obnovit</button>
</form>

<br>

<div id="odpovedOrgList"></div>

<script>
orgListForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const res = await fetch('http://localhost:5000/v1/organizations/listOrganizations');
  const data = await res.json();

  let html = "";

  data.forEach(org => {
    html += `ID: ${org._id}, ${org.name}
    <button onclick="editOrg('${org._id}')">edit</button>
    <button onclick="deleteOrg('${org._id}')">delete</button><br>`;
  });

  odpovedOrgList.innerHTML = html;
});

function editOrg(id) {
  uorgId.value = id;
}

async function deleteOrg(id) {
  if (!confirm("Opravdu smazat organizaci?")) return;

  const res = await fetch('http://localhost:5000/v1/organizations/deleteOrganization', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ organizationId: id })
  });

  const data = await res.json();
  alert(data.message);

  orgListForm.dispatchEvent(new Event('submit')); // обновление списка
}
</script>
