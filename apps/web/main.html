<!DOCTYPE html>
<html lang="cs">
<head>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="css/materialize.min.css" media="screen,projection"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webová aplikace pro podporu výuky finanční gramotnosti studentů SOU</title>
</head>
<body class="blue lighten-2" style="margin: 0; padding: 0; overflow: hidden;">    
    <main style="height: 100dvh; max-height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden;">
        <div style="padding: 24px; background-color: #00000080; color: #FFFFFF; flex-shrink: 0;">
            <h5>Vítejte zpět, <span class="blue-text text-lighten-3">Jan Novák</span></h5>
            <h6>Dnes je <span class="blue-text text-lighten-3">10.1.</span>, čas <span
                    class="blue-text text-lighten-3">1:01</span></h6>
    
            <br>
            <button class="btn waves-effect waves-light blue accent-2 white-text" type="submit"
                style="width: 150px; text-transform: none; border-radius: 4px;">
                Odhlásit se
            </button>
        </div>
    
        <div
            style="padding: 24px 24px 110px 24px; background-color: #000000AA; color: #FFFFFF; flex-grow: 1; overflow-y: auto; height: 0; min-height: 0;">
            
            <!-- tohle treba vygenerovat dynamicky -->
            <button class="card-panel grey darken-4 waves-effect waves-light" style="margin-bottom: 12px; width: 100%; text-align: left; border: none; display: block; cursor: pointer;">
                <h5 class="white-text" style="margin: 0 0 6px 0; font-weight: bold; font-size: 1.3rem; text-transform: none;">Bankovní účet ></h5>
                <p class="grey-text text-lighten-1" style="margin: 0 0 6px 0; font-size: 0.9rem; text-transform: none;">111-123456789/0100</p>
                <p class="grey-text text-lighten-2" style="margin: 0; font-size: 0.8rem; text-transform: none;">123 456 789 CZK</p>
            </button>
            
            <button class="card-panel grey darken-4 waves-effect waves-light" style="margin-bottom: 12px; width: 100%; text-align: left; border: none; display: block; cursor: pointer;">
                <h5 class="white-text" style="margin: 0 0 6px 0; font-weight: bold; font-size: 1.3rem; text-transform: none;">Spořící účet ></h5>
                <p class="grey-text text-lighten-1" style="margin: 0 0 6px 0; font-size: 0.9rem; text-transform: none;">111-123456789/0100</p>
                <p class="grey-text text-lighten-2" style="margin: 0; font-size: 0.8rem; text-transform: none;">123 456 789 CZK</p>
            </button>

        </div>

        <div
            style="position: absolute; bottom: env(safe-area-inset-bottom, 0px); left: 0; width: 100%; display: flex; justify-content: center; gap: 16px; padding: 24px; background: linear-gradient(to top, #00000066 50%, #00000000); pointer-events: none;">
    
            <button class="btn waves-effect waves-light blue accent-2 white-text" type="submit"
                style="width: 150px; text-transform: none; border-radius: 4px; pointer-events: auto;">
                Platba
            </button>
    
            <button class="btn waves-effect waves-light blue accent-2 white-text" type="button"
                style="width: 150px; text-transform: none; border-radius: 4px; pointer-events: auto;">
                QR kód
            </button>
        </div>
    
    </main>
    
    <script type="text/javascript" src="js/materialize.min.js"></script>
</body>
</html>
