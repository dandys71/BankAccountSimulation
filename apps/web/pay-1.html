<!DOCTYPE html>
<html lang="cs">
<head>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="css/materialize.min.css" media="screen,projection"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webová aplikace pro podporu výuky finanční gramotnosti studentů SOU</title>
</head>
<body class="blue lighten-2" style="margin: 0; padding: 0; overflow: hidden;">
    <main
        style="height: 100dvh; max-height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden;">

        <div style="padding: 24px; background-color: #000000AA; color: #FFFFFF; flex-shrink: 0;">
            <span style="display: block;">Přihlášen(a) jako <span class="blue-text text-lighten-3">Jan
                    Novák</span></span>
            <span style="display: block;">Dnes je <span class="blue-text text-lighten-3">10.1.</span>, čas <span
                    class="blue-text text-lighten-3">1:01</span></span>
            <br>
            <button class="btn waves-effect waves-light blue accent-2 white-text" type="button"
                style="width: 125px; text-transform: none; border-radius: 4px;">
                Odhlásit se
            </button>

            <h5>Provedení jednorázové platby (1/2)</h5>
        </div>

        <form method="POST" action=""
            style="padding: 12px 24px 110px 24px; background-color: #000000CC; color: #FFFFFF; flex-grow: 1; overflow-y: auto; height: 0; min-height: 0;">

            <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 24px;">
                <div class="input-field" style="margin: 0; flex-grow: 1;">
                    <input id="account_number" name="account_number" type="number" class="validate white-text" placeholder="Číslo účtu příjemce"
                        required>
                </div>

                <span style="font-size: 1.5rem; color: #FFFFFF; padding-top: 4px;">/</span>

                <div class="input-field" style="margin: 0; width: 15%; flex-shrink: 0;">
                    <input id="bank_code" name="bank_code" type="number" class="validate white-text" placeholder="Kód" required
                        maxLength="4">
                </div>
            </div>

            <div style="display: flex; gap: 16px; align-items: flex-start; margin-bottom: 24px;">
                <div class="input-field" style="margin: 0; flex-grow: 1;">
                    <input id="amount" name="amount" type="number" class="validate white-text" placeholder="Částka" required>
                </div>

                <div class="input-field" style="margin: 0; width: 15%; flex-shrink: 0;">
                    <select id="currency" name="currency" class="browser-default"
                        style="background-color: transparent; color: #FFFFFF; border: none; border-bottom: 1px solid #9e9e9e; height: 3rem; padding: 0; font-size: 1rem; cursor: pointer; outline: none;">
                        
                        <!-- nutno asi pridat vic moznosti -->
                        <option value="CZK" style="background-color: #333; color: #fff;">CZK</option>
                        <option value="EUR" style="background-color: #333; color: #fff;">EUR</option>
                        <option value="USD" style="background-color: #333; color: #fff;">USD</option>
                    </select>
                </div>
            </div>

            <div class="input-field" style="margin-bottom: 24px;">
                <input id="comment" name="comment" type="text" class="validate white-text" placeholder="Komentář" required>
            </div>

            <div id="login-error" class="red-text text-darken-1"
                style="margin-bottom: 20px; font-size: 0.9rem;">
                Chyba!!!!!!!! dynamicky vyplnit
            </div>

            <div
                style="position: absolute; bottom: env(safe-area-inset-bottom, 0px); left: 0; width: 100%; display: flex; justify-content: center; gap: 16px; padding: 24px; background: linear-gradient(to top, #00000066 50%, #00000000); pointer-events: none; z-index: 10;">

                <button class="btn waves-effect waves-light blue accent-2 white-text" type="button"
                    style="width: 150px; text-transform: none; border-radius: 4px; pointer-events: auto;">
                    Zrušit
                </button>

                <button class="btn waves-effect waves-light blue accent-2 white-text" type="submit"
                    style="width: 150px; text-transform: none; border-radius: 4px; pointer-events: auto;">
                    Pokračovat
                </button>
            </div>
        </form>

    </main>

    <script type="text/javascript" src="js/materialize.min.js"></script>
</body>
</html>
